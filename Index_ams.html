<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Massage Share</title>
    <link rel="stylesheet" href="ams.css">
</head>
<body>
    <div class="continer">
        <header class="header_logo">
            <img class="img" src="images/header_images.png">
            <div class="header_name">
                <h1>Auto_Massage_Share</h1>
                <h3>Creator_By_BS</h3>
            </div>
            <div class="btn">
                <input id="button" type="button" value="Share Now">
            </div>
            
        </header>
        <div class="div_clear"></div>
        <main>
            <div class="number">
                <label for="">Target Number:</label>
                <input type="tel" required>
                
            </div>

            <div class="massage_box">
                <label for="">Your Massage Write:</label>
                <input type="text" required>
                
            </div>
        </main>

        <div class="div_clear"></div>
    </div>
    
    
</body>
</html>
